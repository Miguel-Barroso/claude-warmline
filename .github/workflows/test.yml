name: tests
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # the historical keep-warm refresh cases read old tags' policy text
          fetch-depth: 0
      # The Desktop band is a Claude Code plugin whose checks run inside the
      # engine (claude plugin validate / test); test.sh runs them only where
      # `claude` is on PATH, so put it there. Windows skips them.
      - run: curl -fsSL https://claude.ai/install.sh | bash && echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - run: ./test.sh
  # Claude Code for Windows runs the statusline and hooks through Git Bash with
  # a Windows Python behind them: cp1252 files and pipes, CRLF output, C:/
  # paths, no fcntl. The same suite, there.
  test-windows:
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      # test.sh and the shebangs call python3 by name, which not every Windows
      # Python ships; setup-python's does today, this covers the day it doesn't
      - run: command -v python3 || cp "$(command -v python)" "$(dirname "$(command -v python)")/python3.exe"
      - run: ./test.sh
